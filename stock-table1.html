
<html>
<head>
    <title>Table2</title>

    <!-- Style Table using Internal CSS -->

     <!-- border:collapse: collapse removes border inbetween cells
        table tr:nth-child(odd) td { background-color: #e7edf0;
        }  colors background for every alternative row   -->

    <style>

        table{
            border-collapse: collapse;
        }

        table th{
            text-align: left;
            background-color: #3a6070;
            color: #fff;
            padding: 4px 30px 4px 8px;
        }

        table td{
            border: 1px solid #e3e3e3;
            padding: 4px 8px;
        }

        table tr:nth-child(odd) td {
            background-color: #e7edf0;
        }



    </style>



</head>

<body>

    <h1>Stocks 1</h1>

    <table>
        <tr>
            <th>Stock Name</th>
            <th>Open</th>
            <th>Close</th>
            <th>Change</th>
        </tr>

        <tr>
            <td>American Oil</td>
            <td>$4.00</td>
            <td>$3.20</td>
            <td>DOWN</td>
        </tr>

        <tr>
            <td>Rio Tinto</td>
            <td>$2.30</td>
            <td>$2.90</td>
            <td>UP</td>
        </tr>

        <tr>
            <td>AB Mining</td>
            <td>$5.00</td>
            <td>$4.80</td>
            <td>DOWN</td>
        </tr>

        <tr>
            <td>ABC Co</td>
            <td>$3.00</td>
            <td>$3.00</td>
            <td>-</td>
        </tr>

        







    </table>


</body>














</html>
